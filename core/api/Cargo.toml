[package]
name = "mesh-api"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
mesh-constants = { workspace = true }
mesh-crypto = { workspace = true }
mesh-wire = { workspace = true }
mesh-identity = { workspace = true }
mesh-discovery = { workspace = true }
mesh-routing = { workspace = true }
mesh-abuse = { workspace = true }
mesh-countermeasures = { workspace = true }
mesh-handoff = { workspace = true }
mesh-media = { workspace = true }
mesh-storage = { workspace = true }
mesh-lock = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
postcard = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }
x25519-dalek = { workspace = true }
p256 = { workspace = true, optional = true }
p384 = { workspace = true, optional = true }
rsa = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }

[features]
default = []
sqlcipher = ["mesh-storage/sqlcipher"]
# Offline Android hardware key attestation verification (blueprint 12.3).
integrity = ["dep:p256", "dep:p384", "dep:rsa", "dep:sha2"]

[dev-dependencies]
proptest = { workspace = true }
