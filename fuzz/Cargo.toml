[package]
name = "mesh-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
mesh-wire = { path = "../core/wire" }
mesh-identity = { path = "../core/identity" }
mesh-discovery = { path = "../core/discovery" }
mesh-handoff = { path = "../core/handoff" }
mesh-media = { path = "../core/media" }
mesh-api = { path = "../core/api" }
mesh-crypto = { path = "../core/crypto" }
serde_json = "1"

[workspace]

[profile.release]
debug = 1

[[bin]]
name = "envelope"
path = "fuzz_targets/envelope.rs"
test = false
doc = false
bench = false

[[bin]]
name = "inner"
path = "fuzz_targets/inner.rs"
test = false
doc = false
bench = false

