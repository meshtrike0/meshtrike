[workspace]
resolver = "2"
members = ["core/*", "simulator"]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
mesh-constants = { path = "core/constants" }
mesh-crypto = { path = "core/crypto" }
mesh-wire = { path = "core/wire" }
mesh-identity = { path = "core/identity" }
mesh-discovery = { path = "core/discovery" }
mesh-routing = { path = "core/routing" }
mesh-abuse = { path = "core/abuse" }
mesh-countermeasures = { path = "core/countermeasures" }
mesh-handoff = { path = "core/handoff" }
mesh-media = { path = "core/media" }
mesh-storage = { path = "core/storage" }
mesh-lock = { path = "core/lock" }
mesh-api = { path = "core/api" }

vodozemac = "0.11"
snow = { version = "0.10", default-features = false, features = ["default-resolver", "use-chacha20poly1305", "use-blake2", "use-curve25519", "use-getrandom"] }
chacha20poly1305 = "0.11"
hkdf = "0.13"
hmac = "0.13"
sha2 = "0.11"
ed25519-dalek = { version = "3", features = ["rand_core"] }
x25519-dalek = { version = "3", features = ["static_secrets"] }
argon2 = "0.6"
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }
zune-jpeg = "0.5.16-rc2"
zune-core = "*"
jpeg-encoder = "0.7"
raptorq = "2"
qrcode = { version = "0.14", default-features = false }
rqrr = "0.11"
uniffi = "0.32"
wasm-bindgen = "0.2"
getrandom = "0.4"
rand = "0.10"
rand_core = "0.10"
unicode-normalization = "0.1"
zeroize = { version = "1", features = ["derive"] }
subtle = "2.6"
thiserror = "2"
proptest = "1"
hex = "0.4"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", default-features = false, features = ["alloc"] }
# Android key attestation verification (mesh-api feature `integrity`).
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "alloc"] }
p384 = { version = "0.14", default-features = false, features = ["ecdsa", "alloc"] }
rsa = { version = "0.10.0-rc.19", default-features = false, features = ["encoding"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"

[profile.dev.package."*"]
opt-level = 2
